# Build the Docker image on pull requests and report its size,
# compared against the base branch (main) when relevant files change.
name: PR build

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build and report size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ github.head_ref || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version
        id: version
        run: |
          VERSION=$(cat head/version.txt | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build PR image
        uses: docker/build-push-action@v6
        with:
          context: head
          load: true
          build-args: OPENCODE_VERSION=${{ steps.version.outputs.version }}
          tags: sprisa/opencode:pr-${{ github.event.number || 'manual' }}

      - name: Record PR size
        id: pr-size
        run: bash head/scripts/image-size.sh "sprisa/opencode:pr-${{ github.event.number || 'manual' }}" >> "$GITHUB_OUTPUT"

      - name: Check if image-relevant files changed
        id: check-diff
        if: github.event_name == 'pull_request'
        run: |
          git -C head fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git -C head diff "origin/${{ github.base_ref }}" HEAD --name-only -- Dockerfile version.txt version-v1.txt entrypoint.sh entrypoint-v1.sh scripts/init-home.sh mise-config.toml mise-instructions.md)
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout base branch (baseline)
        if: steps.check-diff.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: baseline

      - name: Read baseline version
        if: steps.check-diff.outputs.changed == 'true'
        id: baseline-version
        run: |
          VERSION=$(tr -d '[:space:]' < baseline/version.txt)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build baseline image
        if: steps.check-diff.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: baseline
          load: true
          build-args: OPENCODE_VERSION=${{ steps.baseline-version.outputs.version }}
          tags: sprisa/opencode:baseline

      - name: Record baseline size
        if: steps.check-diff.outputs.changed == 'true'
        id: baseline-size
        run: bash head/scripts/image-size.sh sprisa/opencode:baseline >> "$GITHUB_OUTPUT"

      # Sizes are amd64 and decimal (1 MB = 1,000,000 bytes), like Docker's.
      - name: Report image size
        env:
          CHANGED: ${{ steps.check-diff.outputs.changed }}
          PR_UNPACKED: ${{ steps.pr-size.outputs.unpacked }}
          PR_COMPRESSED: ${{ steps.pr-size.outputs.compressed }}
          BASE_UNPACKED: ${{ steps.baseline-size.outputs.unpacked }}
          BASE_COMPRESSED: ${{ steps.baseline-size.outputs.compressed }}
        run: |
          TAG="pr-${{ github.event.number || 'manual' }}"
          human() { numfmt --to=si --round=nearest --format='%.1f' --suffix=B "$1"; }
          diff_human() {
            local diff=$(( $1 - $2 ))
            if [ "$diff" -lt 0 ]; then echo "-$(human $(( -diff )))"; else echo "+$(human "$diff")"; fi
          }

          {
            echo "## Docker image size"
            echo ""
            echo "| Image | Unpacked | Compressed (download) |"
            echo "|---|---|---|"
            if [ "$CHANGED" = "true" ]; then
              echo "| Baseline (main) | $(human "$BASE_UNPACKED") | $(human "$BASE_COMPRESSED") |"
            fi
            echo "| This PR | $(human "$PR_UNPACKED") | $(human "$PR_COMPRESSED") |"
            if [ "$CHANGED" = "true" ]; then
              echo "| **Difference** | **$(diff_human "$PR_UNPACKED" "$BASE_UNPACKED")** | **$(diff_human "$PR_COMPRESSED" "$BASE_COMPRESSED")** |"
            fi
          } > "$RUNNER_TEMP/size-comment.md"

          {
            cat "$RUNNER_TEMP/size-comment.md"
            echo ""
            echo "### PR layers"
            echo ""
            echo "| Layer | Size |"
            echo "|---|---|"
            docker history "sprisa/opencode:${TAG}" \
              --format "| {{.CreatedSince}} | {{.Size}} |" \
              --no-trunc | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$RUNNER_TEMP/size-comment.md"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd head
          gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/size-comment.md" --edit-last 2>/dev/null \
          || gh pr comment "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/size-comment.md"
