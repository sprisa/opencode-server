name: Publish

on:
  workflow_dispatch:
    inputs:
      force:
        description: Republish versions that are already on Docker Hub
        type: boolean
        default: false

permissions:
  contents: write
  packages: write # build cache on ghcr.io

concurrency:
  group: opencode-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v1 and v2 from main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (build cache)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: task publish FORCE=${{ inputs.force }}
