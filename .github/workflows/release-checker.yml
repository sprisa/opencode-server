# Automated check for upstream opencode releases.
# Runs every 12 hours, once per supported major-version track.
# Every upstream release newer than a track's version file
# (v2 -> version.txt [default], v1 -> version-v1.txt [legacy]) gets its own PR,
# one per version. Re-runs update existing PRs instead of opening duplicates,
# and PRs for versions at or below the current pin are closed as superseded.
# Merging a release PR re-runs the check so the remaining PRs rebase onto main.
name: "opencode release checker"

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [main]
    paths:
      - version.txt
      - version-v1.txt
  workflow_dispatch:

concurrency:
  group: release-checker
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: anomalyco/opencode
  TARGET_BRANCH: main

jobs:
  check-bump:
    name: Check and bump (${{ matrix.track }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: v2
            version_file: version.txt
          - track: v1
            version_file: version-v1.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: current
        run: |
          VERSION=$(tr -d '[:space:]' < "${{ matrix.version_file }}")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Current: ${VERSION}"

      - name: List pending upstream releases (${{ matrix.track }})
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(bash ./scripts/pending-releases.sh "${{ matrix.track }}" "${{ steps.current.outputs.version }}" | paste -sd' ' -)
          echo "versions=${VERSIONS}" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSIONS" ]; then
            echo "::notice::${{ matrix.track }} is up to date (${{ steps.current.outputs.version }})"
          else
            echo "Pending ${{ matrix.track }}: ${VERSIONS}"
          fi

      - name: Close superseded release PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT: ${{ steps.current.outputs.version }}
        run: |
          PREFIX="pr/opencode-release/${{ matrix.track }}."
          gh pr list --state open --base "${{ env.TARGET_BRANCH }}" --json number,headRefName \
            | jq -r --arg prefix "$PREFIX" --arg current "$CURRENT" '
                .[]
                | select(.headRefName | startswith($prefix))
                | select((.headRefName | ltrimstr("pr/opencode-release/v") | split(".") | map(tonumber))
                         <= ($current | split(".") | map(tonumber)))
                | "\(.number) \(.headRefName)"
              ' \
            | while read -r number branch; do
                echo "Closing #${number} (${branch}): ${{ matrix.version_file }} is already ${CURRENT}"
                gh pr close "$number" --delete-branch \
                  --comment "Superseded: \`${{ matrix.version_file }}\` on \`${{ env.TARGET_BRANCH }}\` is already v${CURRENT}."
              done

      - name: Bump and create one PR per release
        if: steps.pending.outputs.versions != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONS: ${{ steps.pending.outputs.versions }}
          VERSION_FILE: ${{ matrix.version_file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ env.TARGET_BRANCH }}"
          for PR_VERSION in $VERSIONS; do
            echo "::group::v${PR_VERSION}"
            # Rebuild each PR branch from latest main so it only changes the version file.
            PR_BRANCH="pr/opencode-release/v${PR_VERSION}"
            git checkout -B "$PR_BRANCH" "origin/${{ env.TARGET_BRANCH }}"
            git push origin "$PR_BRANCH" --force
            ./scripts/bump-version.sh "$PR_VERSION" "${{ env.TARGET_BRANCH }}" "$VERSION_FILE"
            echo "::endgroup::"
          done
